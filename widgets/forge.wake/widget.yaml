# PLACEHOLDER wording: name, description and labels.
schema: 1
id: forge.wake
name: Wake-on-LAN
version: 1.0.0
author: WidgetForge
description: Buttons that wake computers on your network (a NAS, a gaming PC, a server) with a Wake-on-LAN packet. The computer must have Wake-on-LAN turned on.
category: system

window:
  size: [280, 150]
  min_size: [90, 70]
  layer: desktop

style:
  theme: glass
  accent: "#6cf0a0"

permissions:
  wake: true

settings:
  - { key: title, type: text, label: Title, default: Wake up }
  - { key: name1, type: text, label: Computer 1 name, default: "" }
  - { key: mac1, type: text, label: "Computer 1 MAC address (aa:bb:cc:dd:ee:ff, optionally @ broadcast address)", default: "" }
  - { key: name2, type: text, label: Computer 2 name, default: "" }
  - { key: mac2, type: text, label: "Computer 2 MAC address (aa:bb:cc:dd:ee:ff, optionally @ broadcast address)", default: "" }
  - { key: name3, type: text, label: Computer 3 name, default: "" }
  - { key: mac3, type: text, label: "Computer 3 MAC address (aa:bb:cc:dd:ee:ff, optionally @ broadcast address)", default: "" }
  - { key: name4, type: text, label: Computer 4 name, default: "" }
  - { key: mac4, type: text, label: "Computer 4 MAC address (aa:bb:cc:dd:ee:ff, optionally @ broadcast address)", default: "" }
  - { key: name5, type: text, label: Computer 5 name, default: "" }
  - { key: mac5, type: text, label: "Computer 5 MAC address (aa:bb:cc:dd:ee:ff, optionally @ broadcast address)", default: "" }
  - { key: name6, type: text, label: Computer 6 name, default: "" }
  - { key: mac6, type: text, label: "Computer 6 MAC address (aa:bb:cc:dd:ee:ff, optionally @ broadcast address)", default: "" }
  - { key: columns, type: number, label: Buttons per row, default: 3, min: 1, max: 6 }

ui:
  blocks:
    - { type: text, text: "{{ settings.title }}", weight: bold, visible: "{{ settings.title }}" }
    - { type: text, text: "Add a computer's MAC address in this widget's settings.", size: sm, color: muted, visible: "{{ settings.mac1 | not }}" }
    - type: grid
      columns: "{{ settings.columns }}"
      gap: 6
      children:
        - type: button
          style: tile
          icon: "⏻"
          label: "{{ settings.name1 | default('Computer 1') }}"
          action: wol.mac1
          visible: "{{ settings.mac1 }}"
        - type: button
          style: tile
          icon: "⏻"
          label: "{{ settings.name2 | default('Computer 2') }}"
          action: wol.mac2
          visible: "{{ settings.mac2 }}"
        - type: button
          style: tile
          icon: "⏻"
          label: "{{ settings.name3 | default('Computer 3') }}"
          action: wol.mac3
          visible: "{{ settings.mac3 }}"
        - type: button
          style: tile
          icon: "⏻"
          label: "{{ settings.name4 | default('Computer 4') }}"
          action: wol.mac4
          visible: "{{ settings.mac4 }}"
        - type: button
          style: tile
          icon: "⏻"
          label: "{{ settings.name5 | default('Computer 5') }}"
          action: wol.mac5
          visible: "{{ settings.mac5 }}"
        - type: button
          style: tile
          icon: "⏻"
          label: "{{ settings.name6 | default('Computer 6') }}"
          action: wol.mac6
          visible: "{{ settings.mac6 }}"
