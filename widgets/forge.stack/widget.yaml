schema: 1
id: forge.stack
name: Stack
version: 1.0.0
author: WidgetForge
description: A column that holds other widgets in one window. Add widgets to it from Desktop → Stack.
category: other

window:
  size: [280, 520]
  min_size: [180, 160]
  layer: desktop
  multi_instance: true

style:
  theme: glass
  accent: "#9aa8ff"

settings:
  - { key: title, type: text, label: Title, default: "" }
  - { key: show_names, type: bool, label: Show widget names, default: true }

ui:
  stack: true
