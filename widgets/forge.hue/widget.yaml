# PLACEHOLDER wording: name, description and labels.
schema: 1
id: forge.hue
name: Hue Lights
version: 1.0.0
author: WidgetForge
description: Switch your Philips Hue lights on and off from the desktop, straight through your Hue Bridge on your own network.
category: home

window:
  size: [300, 200]
  min_size: [160, 90]
  layer: desktop

style:
  theme: glass
  accent: "#ffd166"

permissions:
  network: ["setting:bridge"]
  clipboard: true

settings:
  - { key: bridge, type: text, label: "Bridge address (e.g. http://192.168.1.20)", default: "" }
  - { key: username, type: secret, label: Bridge user name (from Pair below) }
  - { key: lights, type: text, label: "Only these lights (names, comma-separated; empty = all)", default: "" }
  - { key: columns, type: number, label: Buttons per row, default: 3, min: 1, max: 8 }

data:
  lights:
    source: net
    when: "{{ settings.bridge }}"
    url: "{{ settings.bridge }}/api/[[secret:username]]/lights"
    interval: 5000
  toggle:
    source: net
    manual: true
    method: PUT
    url: "{{ settings.bridge }}/api/[[secret:username]]/lights/{{ arg.key }}/state"
    body:
      "on": "{{ arg.state.on | not }}"
  pair:
    source: net
    manual: true
    method: POST
    url: "{{ settings.bridge }}/api"
    body:
      devicetype: "widgetforge#desktop"

ui:
  show_errors: false
  blocks:
    - { type: text, text: "Type your bridge's address in this widget's settings.", size: sm, color: muted, visible: "{{ settings.bridge | not }}" }
    - type: each
      items: "{{ lights.json | entries | where('name') }}"
      columns: "{{ settings.columns }}"
      child:
        type: button
        style: tile
        icon: "{{ item.state.on | choose('💡', '○') }}"
        label: "{{ item.name }}"
        note: "{{ item.state.on | choose(item.state.bri | div(2.54) | round, '') }}{{ item.state.on | choose('%', 'Off') }}"
        on: "{{ item.state.on }}"
        action: fetch.toggle
        arg: "{{ item }}"
        visible: "{{ settings.lights | not | choose(true, settings.lights | split(',') | includes(item.name)) }}"
    - type: column
      visible: "{{ settings.bridge | choose(_errors.lights | choose(true, lights.json[0].error), false) }}"
      children:
        - { type: text, text: "Not paired yet. Press the round button on the bridge, then Pair within 30 seconds.", size: sm, color: muted }
        - { type: button, label: Pair, action: fetch.pair }
    - type: text
      size: sm
      text: "Paired. Copy this user name into the settings: {{ pair.json[0].success.username }}"
      visible: "{{ pair.json[0].success }}"
    - { type: button, label: Copy user name, copy: "{{ pair.json[0].success.username }}", visible: "{{ pair.json[0].success }}" }
    - { type: text, text: "{{ pair.json[0].error.description }}", size: sm, color: warn, visible: "{{ pair.json[0].error }}" }
