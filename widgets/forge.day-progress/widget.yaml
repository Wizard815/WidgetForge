schema: 1
id: forge.day-progress
name: Day Progress
version: 1.0.0
author: WidgetForge
description: How much of today, this week, month and year has gone by. An example of an HTML/JS widget.
category: time
icon: icon.svg

window:
  size: [260, 190]
  min_size: [180, 140]
  layer: desktop

style:
  theme: glass
  accent: "#a0e86f"

settings:
  - { key: week_starts_monday, type: bool, label: Week starts on Monday, default: true }
  - { key: show_year, type: bool, label: Show year, default: true }

ui:
  entry: index.html
