[package]
name = "widgetforge"
version = "0.1.0"
description = "WidgetForge — desktop widgets for everyone"
edition = "2021"
rust-version = "1.90"

[lib]
name = "widgetforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
sysinfo = "0.38.4"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["v4"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
