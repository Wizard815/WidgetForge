[package]
name = "widgetforge"
version = "0.1.0"
edition = "2021"
description = "Desktop widgets"

[lib]
name = "widgetforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sysinfo = "0.40"
reqwest = { version = "0.13", features = ["gzip"] }
url = "2"
sha2 = "0.10"
base64 = "0.21"
getrandom = "0.3"
starship-battery = "0.12"
arboard = { version = "3", default-features = false }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# Already used by reqwest; used directly for email (IMAP over TLS).
rustls = "0.23"
# Already used by reqwest and tauri; used directly for .forgewidget packages.
flate2 = "1"
crc32fast = "1"
dirs = "6"
rustls-platform-verifier = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2"
# Already used by the clipboard; used directly for the screen-time widget.
x11rb = { version = "0.13", features = ["screensaver"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_SystemInformation"] }
